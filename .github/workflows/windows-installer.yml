name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - win
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packager dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[documents]' 'pyinstaller>=6,<7'
          choco install innosetup --no-progress -y
      - name: Build bundled desktop app
        run: >
          pyinstaller --noconfirm --clean --windowed --name SecondBrain
          --add-data "web;web"
          --add-data "core/prompts;core/prompts"
          --add-data "LICENSE;."
          --collect-all uvicorn
          --collect-all imageio_ffmpeg
          windows/second_brain_launcher.py
      - name: Verify bundled desktop app
        run: python scripts/smoke_desktop.py dist/SecondBrain/SecondBrain.exe
      - name: Build setup executable
        run: iscc windows/installer/SecondBrain.iss
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-Windows-Installer
          path: dist-installer/SecondBrain-Setup-*.exe
          if-no-files-found: error
      - name: Publish tagged installer release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-installer\SecondBrain-Setup-*.exe | Select-Object -First 1
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release create $env:GITHUB_REF_NAME $installer.FullName --title "SecondBrain $env:GITHUB_REF_NAME" --notes-file "docs/release-$version.md"
