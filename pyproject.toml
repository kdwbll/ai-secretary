[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-ai-secretary"
version = "0.7.0"
description = "Local-first AI secretary backed by human-readable Markdown memory"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
documents = ["pypdf>=4,<6", "python-docx>=1,<2", "openpyxl>=3.1,<4", "Pillow>=10,<12", "imageio-ffmpeg>=0.5,<1"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
second-brain = "core.secretary.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
